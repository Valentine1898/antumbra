name: Sealer

# Clears the finished epochs of the testnet pool in deployment.json, so swaps
# made in the hosted wallet can be claimed even when nobody is running
# scripts/sealer.sh. A sealer running locally clears an epoch within seconds;
# this one gets to it within a few minutes, and the two do not conflict.
#
# The workflow keeps itself going. GitHub's scheduler did not start a single
# run of it in its first six hours, so each run ends by starting the next:
# the `next` job waits out the timer of the `sealer-pause` environment (four
# minutes; a waiting job occupies no runner) and dispatches the workflow
# again. The schedule below is only a watchdog that restarts a broken chain.
# To start the chain by hand: gh workflow run sealer.yml
# To stop it: disable the workflow, or cancel the run that is waiting.
#
# Each run scans back to the start of the last run that succeeded, so however
# late a run is, no epoch is skipped. The sealer's keys are the repository
# secret ANTUMBRA_SEALER_SECRET: the contents of deployment.secret.json (the
# pool account's own key is not used and can be left empty). The environment
# is repository configuration, made once:
#   gh api -X PUT repos/OWNER/REPO/environments/sealer-pause -F wait_timer=4
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      lookback:
        description: "Epochs to scan back (empty: since the last successful run)"
        required: false
        type: string

permissions: {}

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    concurrency:
      group: sealer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Restore the CLI
        id: cli
        uses: actions/cache/restore@v4
        with:
          path: sealer-bin
          key: antumbra-cli-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**') }}
      - name: Build the CLI (only when its sources changed)
        if: steps.cli.outputs.cache-hit != 'true'
        run: |
          cargo build -p antumbra-cli --release
          mkdir -p sealer-bin && cp target/release/antumbra sealer-bin/
      - name: Keep the CLI for the next runs
        if: steps.cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sealer-bin
          key: ${{ steps.cli.outputs.cache-primary-key }}
      - name: Clear finished epochs
        env:
          SEALER_SECRET: ${{ secrets.ANTUMBRA_SEALER_SECRET }}
          LOOKBACK: ${{ inputs.lookback }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SEALER_SECRET" ]; then echo "::error::the ANTUMBRA_SEALER_SECRET repository secret is not set"; exit 1; fi
          trap 'rm -f deployment.secret.json' EXIT
          printf '%s' "$SEALER_SECRET" > deployment.secret.json
          # The secret is one JSON document; keep each key in it out of the log too.
          for field in deployer_key sealer_seed executor_key; do
            value=$(jq -r --arg f "$field" '.[$f] // empty' deployment.secret.json)
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done

          # How far back to look. An epoch is 20 blocks, about 12 seconds; counting
          # 9 seconds per epoch and adding 60 more errs on the side of rescanning,
          # which also catches a swap that landed minutes after it was proved.
          # A long window is cheap: the sealer first asks the chain whether the
          # pool changed at all, and probes epochs only around the changes.
          if [[ "$LOOKBACK" =~ ^[0-9]+$ ]]; then
            lookback=$LOOKBACK
          else
            last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sealer.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty' || true)
            if [ -n "$last" ]; then
              gap=$(( $(date +%s) - $(date -d "$last" +%s) ))
              lookback=$(( gap / 9 + 60 ))
              echo "last successful run started $(( gap / 60 )) min ago"
            else
              lookback=300
            fi
            if [ "$lookback" -gt 1500 ]; then
              echo "::warning::scanning the last 1500 epochs only; run this workflow by hand with a larger lookback to reach older ones"
              lookback=1500
            fi
          fi
          echo "scanning the last $lookback epochs"

          pair=$(jq -r .pair_id deployment.json)
          for rpc in https://test.rpc.fastnear.com https://rpc.testnet.near.org https://test.rpc.fastnear.com; do
            if sealer-bin/antumbra --network testnet --rpc "$rpc" sealer clear --pair "$pair" --lookback "$lookback"; then exit 0; fi
            echo "clearing through $rpc failed; trying the next endpoint"
            sleep 15
          done
          exit 1

  next:
    # Starts the next run once the environment's wait timer has passed. Only
    # the newest run does, so runs started by hand or by the schedule join the
    # one chain instead of starting more.
    needs: clear
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    environment:
      name: sealer-pause
      deployment: false
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sealer.yml/runs?per_page=1" --jq '.workflow_runs[0].id // empty' || true)
          if [ -n "$newest" ] && [ "$newest" != "$GITHUB_RUN_ID" ]; then
            echo "run $newest is newer and carries on from here"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/sealer.yml/dispatches" -f ref="$GITHUB_REF_NAME"; then
              echo "started the next run"
              exit 0
            fi
            sleep 20
          done
          echo "::error::could not start the next run; start the chain again with: gh workflow run sealer.yml"
          exit 1
