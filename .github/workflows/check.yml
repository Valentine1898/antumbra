name: Check

# Runs what the README's "Try it" section promises, on a clean Linux machine:
# scripts/check.sh (unit tests with the circuits' constraint counts, the
# contract build with the verifying keys regenerated, and the two sandbox
# end-to-end scenarios), then confirms that the regenerated keys are the ones
# committed in keys/.
# To run it by hand: gh workflow run check.yml
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "contracts/**"
      - "tests/**"
      - "keys/**"
      - "scripts/check.sh"
      - "scripts/build-contracts.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/check.yml"

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests, contracts, sandbox end-to-end
        run: scripts/check.sh
      - name: The regenerated verifying keys are the committed ones
        run: git diff --exit-code -- keys
