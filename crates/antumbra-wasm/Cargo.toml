[package]
name = "antumbra-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Antumbra wallet for the browser: scanning, proving and call building through wasm-bindgen"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
antumbra-wallet = { path = "../antumbra-wallet", default-features = false }
antumbra-core = { path = "../antumbra-core", default-features = false, features = ["crypto"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde_json.workspace = true
anyhow.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
