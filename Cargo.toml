[workspace]
resolver = "2"
members = [
    "crates/antumbra-core",
    "crates/antumbra-circuits",
    "crates/antumbra-wallet",
    "crates/antumbra-cli",
    "crates/antumbra-wasm",
    "contracts/pool",
    "contracts/test-ft",
    "tests/e2e",
    "spike/gen",
    "spike/contract",
    "spike/tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Valentine1898/antumbra"

[workspace.dependencies]
# NEAR
near-sdk = "5.30"
near-workspaces = "0.24"

# arkworks (all no_std-capable; enable "std" only in native tools)
ark-ec = { version = "0.6", default-features = false }
ark-ff = { version = "0.6", default-features = false }
ark-std = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6", default-features = false, features = ["derive"] }
ark-relations = { version = "0.6", default-features = false }
ark-r1cs-std = { version = "0.6", default-features = false }
ark-snark = { version = "0.6", default-features = false }
ark-groth16 = { version = "0.6", default-features = false }
ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
ark-bls12-381 = { version = "0.6", default-features = false, features = ["curve"] }
ark-bls12-377 = { version = "0.6", default-features = false, features = ["curve"] }

ark-crypto-primitives = { version = "0.6", default-features = false, features = ["sponge"] }
near-contract-standards = "5.30"
borsh = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
rand = "0.9"

# misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Dependencies (arkworks) are compiled optimised even in dev builds, so tests prove in seconds.
[profile.dev.package."*"]
opt-level = 3

# Release profile tuned for NEAR wasm: instruction count is gas, so optimise for speed, not size.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = false
